<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>SomChat Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#e5ddd5;
height:100vh;
overflow:hidden;
}

header{
height:65px;
background:#075e54;
color:white;
display:flex;
align-items:center;
gap:12px;
padding:8px 12px;
}

.back{
background:none;
border:0;
color:white;
font-size:30px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#128c7e;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
}

.username{
font-size:17px;
font-weight:bold;
}

.status{
font-size:12px;
}

#messages{
height:calc(100vh - 125px);
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:7px;
}

.message{
max-width:78%;
padding:9px 12px;
border-radius:10px;
word-break:break-word;
}

.mine{
align-self:flex-end;
background:#dcf8c6;
}

.theirs{
align-self:flex-start;
background:white;
}

.time{
font-size:10px;
color:#777;
text-align:right;
margin-top:4px;
}

.empty{
margin:auto;
background:white;
padding:15px;
border-radius:10px;
color:#777;
}

.input-area{
height:60px;
background:#f0f2f5;
display:flex;
gap:8px;
padding:8px;
}

#messageInput{
flex:1;
border:0;
outline:0;
border-radius:22px;
padding:12px 16px;
font-size:16px;
}

#sendButton{
width:44px;
height:44px;
border:0;
border-radius:50%;
background:#128c7e;
color:white;
font-size:20px;
}

@media(max-width:500px){

.message{
max-width:85%;
}

}
</style>

</head>

<body>

<header>

<button
class="back"
onclick="history.back()">
‹
</button>

<div id="avatar" class="avatar">
👤
</div>

<div class="user-info">

<div
id="username"
class="username">
Loading...
</div>

<div
id="status"
class="status">
...
</div>

</div>

</header>

<div id="messages">

<div class="empty">
Loading messages...
</div>

</div>

<div class="input-area">

<input
id="messageInput"
type="text"
placeholder="Write a message..."
autocomplete="off"
>

<button id="sendButton">
➤
</button>

</div>

<script>

let currentUser=null;
let receiverId=null;

const params=
new URLSearchParams(
window.location.search
);

receiverId=
params.get("user");


async function start(){

  if(!receiverId){

    alert("User lama dooran");

    location.href="users.html";

    return;
  }

  const {
    data,
    error
  } =
  await supabaseClient.auth
  .getUser();

  if(error || !data.user){

    location.href="login.html";

    return;
  }

  currentUser=data.user;

  await loadReceiver();

  await loadMessages();

  startRealtime();

}


async function loadReceiver(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,country,avatar_url,online"
  )
  .eq("id",receiverId)
  .single();

  if(error || !data){

    alert("User lama helin");

    location.href="users.html";

    return;
  }

  document
  .getElementById("username")
  .textContent=
    data.username || "User";

  document
  .getElementById("status")
  .textContent=
    data.online
    ? "● Online"
    : "Offline";

  if(data.avatar_url){

    document
    .getElementById("avatar")
    .innerHTML=
      `<img src="${data.avatar_url}">`;

  }

}


async function loadMessages(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("messages")
  .select(
    "id,sender_id,receiver_id,message,created_at"
  )
  .or(
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
  )
  .order(
    "created_at",
    {ascending:true}
  );

  if(error){

    document
    .getElementById("messages")
    .innerHTML=
      `<div class="empty">
        ❌ ${error.message}
      </div>`;

    return;
  }

  renderMessages(data || []);

}


function renderMessages(list){

  const box=
    document.getElementById("messages");

  box.innerHTML="";

  if(!list.length){

    box.innerHTML=
      `<div class="empty">
        👋 Start your conversation
      </div>`;

    return;
  }

  list.forEach(addMessage);

  scrollBottom();

}


function addMessage(row){

  const box=
    document.getElementById("messages");

  const empty=
    box.querySelector(".empty");

  if(empty)
    empty.remove();

  const div=
    document.createElement("div");

  const mine=
    row.sender_id === currentUser.id;

  div.className=
    mine
    ? "message mine"
    : "message theirs";

  const text=
    document.createElement("div");

  text.textContent=
    row.message;

  const time=
    document.createElement("div");

  time.className="time";

  time.textContent=
    new Date(
      row.created_at
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  div.appendChild(text);

  div.appendChild(time);

  box.appendChild(div);

  scrollBottom();

}


async function sendMessage(){

  const input=
    document.getElementById(
      "messageInput"
    );

  const message=
    input.value.trim();

  if(!message)
    return;

  const {
    data,
    error
  } =
  await supabaseClient
  .from("messages")
  .insert({

    sender_id:
      currentUser.id,

    receiver_id:
      receiverId,

    message:
      message

  })
  .select()
  .single();

  if(error){

    alert(
      "Message lama dirin:\n"+
      error.message
    );

    return;
  }

  input.value="";

  addMessage(data);

}


function startRealtime(){

  supabaseClient
  .channel(
    "somchat-messages"
  )
  .on(
    "postgres_changes",
    {
      event:"INSERT",
      schema:"public",
      table:"messages"
    },
    payload=>{

      const row=
        payload.new;

      const belongs=

        (
          row.sender_id === currentUser.id &&
          row.receiver_id === receiverId
        )

        ||

        (
          row.sender_id === receiverId &&
          row.receiver_id === currentUser.id
        );

      if(!belongs)
        return;

      if(
        row.sender_id === currentUser.id
      )
        return;

      addMessage(row);

    }
  )
  .subscribe();

}


function scrollBottom(){

  const box=
    document.getElementById(
      "messages"
    );

  setTimeout(()=>{

    box.scrollTop=
      box.scrollHeight;

  },50);

}


document
.getElementById("sendButton")
.addEventListener(
"click",
sendMessage
);


document
.getElementById("messageInput")
.addEventListener(
"keydown",
e=>{

  if(e.key==="Enter"){

    e.preventDefault();

    sendMessage();

  }

});


start();

</script>

</body>
</html>
