<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SomChat - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#075e54,#128c7e);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  color:#075e54;
  margin:8px 0 25px;
}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#075e54;
  color:white;
  font-size:17px;
  font-weight:bold;
}

#result{
  text-align:center;
  margin-top:15px;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#777;
}

.register a{
  color:#075e54;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">💬</div>

<h1>Login</h1>

<form id="form">

<label>Email</label>

<input
  id="email"
  type="email"
  placeholder="Email"
  required
>

<label>Password</label>

<input
  id="password"
  type="password"
  placeholder="Password"
  required
>

<button id="button" type="submit">
Login
</button>

</form>

<div id="result"></div>

<div class="register">
Don't have an account?
<a href="register.html">
Create Account
</a>
</div>

</div>

<script>

const form =
document.getElementById("form");

const button =
document.getElementById("button");

const result =
document.getElementById("result");

form.addEventListener(
"submit",
async function(e){

  e.preventDefault();

  button.disabled=true;
  button.textContent="Logging in...";

  result.innerHTML="";

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth
    .signInWithPassword({

      email:email,

      password:password

    });

    if(error)
      throw error;

    if(!data.user)
      throw new Error("Login failed.");

    result.innerHTML =
      "✅ Login successful!";

    setTimeout(function(){

      location.href="users.html";

    },800);

  }
  catch(error){

    console.error(error);

    result.innerHTML =
      "❌ " + error.message;

    button.disabled=false;
    button.textContent="Login";

  }

});

</script>

</body>
</html>
