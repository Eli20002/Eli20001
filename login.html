<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SomChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #087f5b;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066b4d;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d9534f;
    }

    .bottom {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .bottom a {
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">💬 SomChat</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to your SomChat account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="bottom">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        if (!email || !password) {
          message.textContent =
            "Please enter your email and password.";
          return;
        }

        message.style.color = "#087f5b";
        message.textContent =
          "Login form is ready. Supabase will be connected next.";

      });
  </script>

</body>
</html>
