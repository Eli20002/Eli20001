<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SomChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      color: #087f5b;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .bottom {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .bottom a {
      color: #087f5b;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">💬 SomChat</div>

  <h2>Welcome Back</h2>

  <p class="subtitle">
    Login to your SomChat account
  </p>

  <form id="loginForm">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      required
    >

    <button id="loginButton" type="submit">
      Login
    </button>

  </form>

  <div id="message"></div>

  <div class="bottom">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>

<script>
  // ================================
  // SOMCHAT SUPABASE CONFIG
  // ================================

  const SUPABASE_URL =
    "https://praguwyyshmhmmowofqv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JPzVvllEgAUcBD_ahGZR6g_Z2rrzRDW";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  // ================================
  // LOGIN
  // ================================

  const form =
    document.getElementById("loginForm");

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginButton");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;

    message.textContent = "";
    message.style.color = "#555";

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Login failed.");
      }

      message.style.color = "#087f5b";
      message.textContent =
        "Login successful!";

      setTimeout(function() {
        window.location.href = "chat.html";
      }, 800);

    } catch (error) {

      console.error(error);

      message.style.color = "#d9534f";

      message.textContent =
        error.message ||
        "Email or password is incorrect.";

    } finally {

      button.disabled = false;
      button.textContent = "Login";
    }

  });
</script>

</body>
</html>
