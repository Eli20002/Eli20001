<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SomChat - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #075e54, #128c7e);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      color: #075e54;
    }

    .sub {
      text-align: center;
      color: #777;
      margin: 8px 0 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #128c7e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #25d366;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .register a {
      color: #075e54;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">💬</div>

  <h1>SomChat</h1>

  <p class="sub">Login to your account</p>

  <form id="loginForm">

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      required
    >

    <button id="loginButton" type="submit">
      Login
    </button>

  </form>

  <div id="message"></div>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://praguwyyshmhmmowofqv.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNByYWd1d3l5c2htaG1tb3dvZnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzA3NjYsImV4cCI6MjEwMjE0Njc2Nn0.oJjsk_93uBMLeT-8ydDeecJBpcKI4IwTZaVmDU0t-fk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  button.disabled = true;
  button.textContent = "Logging in...";

  message.innerHTML = "";


  try {

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {
      throw error;
    }


    if (!data.user) {

      throw new Error(
        "Login failed."
      );

    }


    // Set user online
    await supabaseClient
      .from("profiles")
      .update({
        online: true,
        last_seen: new Date().toISOString()
      })
      .eq("id", data.user.id);


    message.innerHTML =
      "✅ Login successful!<br>" +
      "Opening SomChat...";


    setTimeout(() => {

      window.location.href =
        "users.html";

    }, 1000);


  } catch (error) {

    console.error(error);

    message.innerHTML =
      "❌ " + error.message;

    button.disabled = false;
    button.textContent = "Login";

  }

});

</script>

</body>
</html>
