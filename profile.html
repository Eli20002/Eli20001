<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>SomChat - Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:#f5f7f9;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#075e54;
margin-bottom:20px;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
background:#128c7e;
color:white;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 20px;
font-size:40px;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

label{
display:block;
font-weight:bold;
margin:14px 0 6px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:10px;
background:#075e54;
color:white;
font-weight:bold;
font-size:16px;
}

#result{
text-align:center;
margin-top:15px;
}

.back{
background:#eee;
color:#333;
}

</style>

</head>

<body>

<div class="box">

<h1>👤 My Profile</h1>

<div
id="avatar"
class="avatar">
👤
</div>

<label>Username</label>

<input
id="username"
type="text"
maxlength="30"
>

<label>Country</label>

<input
id="country"
type="text"
>

<label>About</label>

<textarea
id="bio"
placeholder="Tell people about yourself..."
></textarea>

<button id="save">
💾 Save Profile
</button>

<button
class="back"
onclick="location.href='users.html'">
← Back
</button>

<div id="result"></div>

</div>

<script>

let currentUser=null;

async function start(){

  const {
    data,
    error
  } =
  await supabaseClient.auth
  .getUser();

  if(error || !data.user){

    location.href="login.html";

    return;
  }

  currentUser=data.user;

  await loadProfile();

}


async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "username,country,bio,avatar_url"
  )
  .eq("id",currentUser.id)
  .single();

  if(error){

    show(error.message);

    return;
  }

  document
  .getElementById("username")
  .value=
    data.username || "";

  document
  .getElementById("country")
  .value=
    data.country || "";

  document
  .getElementById("bio")
  .value=
    data.bio || "";

  if(data.avatar_url){

    document
    .getElementById("avatar")
    .innerHTML=
      `<img src="${data.avatar_url}">`;

  }

}


document
.getElementById("save")
.addEventListener(
"click",
async function(){

  const username=
    document
    .getElementById("username")
    .value.trim();

  const country=
    document
    .getElementById("country")
    .value.trim();

  const bio=
    document
    .getElementById("bio")
    .value.trim();

  if(username.length<3){

    show(
      "❌ Username waa gaaban yahay."
    );

    return;
  }

  const {
    error
  } =
  await supabaseClient
  .from("profiles")
  .update({

    username:username,
    country:country,
    bio:bio

  })
  .eq("id",currentUser.id);

  if(error){

    show(
      "❌ "+error.message
    );

    return;
  }

  show(
    "✅ Profile waa la kaydiyay."
  );

});


function show(text){

  document
  .getElementById("result")
  .textContent=text;

}


start();

</script>

</body>
</html>
