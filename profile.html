<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | SomChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      min-height: 100vh;
    }

    header {
      height: 65px;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .status {
      color: #087f5b;
      margin-bottom: 25px;
    }

    .info {
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .row {
      margin-bottom: 18px;
    }

    .label {
      color: #777;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
      word-break: break-word;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }

    .chat-btn {
      background: #087f5b;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #333;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

    @media (max-width: 550px) {
      .container {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    💬 SomChat
  </div>

  <a href="chat.html">
    Chat
  </a>

</header>

<div class="container">

  <div class="card">

    <div class="avatar" id="avatar">
      U
    </div>

    <h1 id="username">
      Loading...
    </h1>

    <div class="status">
      ● Online
    </div>

    <div class="info">

      <div class="row">

        <div class="label">
          Username
        </div>

        <div class="value" id="usernameInfo">
          Loading...
        </div>

      </div>

      <div class="row">

        <div class="label">
          Email
        </div>

        <div class="value" id="emailInfo">
          Loading...
        </div>

      </div>

      <div class="row">

        <div class="label">
          Country
        </div>

        <div class="value" id="countryInfo">
          Somalia 🇸🇴
        </div>

      </div>

    </div>

    <div class="buttons">

      <a
        href="chat.html"
        class="btn chat-btn"
      >
        💬 Open Chat
      </a>

      <button
        id="logout"
        class="btn logout-btn"
      >
        Logout
      </button>

    </div>

    <div id="message"></div>

  </div>

</div>

<script>

  // ================================
  // SUPABASE
  // ================================

  const SUPABASE_URL =
    "https://praguwyyshmhmmowofqv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JPzVvllEgAUcBD_ahGZR6g_Z2rrzRDW";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ================================
  // LOAD PROFILE
  // ================================

  async function loadProfile() {

    const {
      data: authData,
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !authData.user) {

      window.location.href =
        "login.html";

      return;
    }

    const user =
      authData.user;


    const {
      data: profile,
      error
    } = await supabaseClient
      .from("profiles")
      .select(
        "username, email, country"
      )
      .eq("id", user.id)
      .single();


    if (error) {

      console.error(error);

      document.getElementById(
        "message"
      ).textContent =
        "Could not load profile.";

      return;
    }


    const username =
      profile.username || "SomChat User";

    const email =
      profile.email || user.email || "";

    const country =
      profile.country || "Somalia";


    document.getElementById(
      "username"
    ).textContent = username;


    document.getElementById(
      "usernameInfo"
    ).textContent = username;


    document.getElementById(
      "emailInfo"
    ).textContent = email;


    document.getElementById(
      "countryInfo"
    ).textContent =
      country + " 🇸🇴";


    document.getElementById(
      "avatar"
    ).textContent =
      username.charAt(0).toUpperCase();

  }


  // ================================
  // LOGOUT
  // ================================

  document
    .getElementById("logout")
    .addEventListener(
      "click",
      async function() {

        const {
          error
        } = await supabaseClient
          .auth
          .signOut();

        if (error) {

          document.getElementById(
            "message"
          ).textContent =
            error.message;

          return;
        }

        window.location.href =
          "login.html";

      }
    );


  // Start
  loadProfile();

</script>

</body>
</html>
