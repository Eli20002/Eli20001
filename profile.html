<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | SomChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      min-height: 100vh;
    }

    header {
      height: 65px;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      margin: 0 auto 18px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .status {
      color: #087f5b;
      margin-bottom: 25px;
    }

    .info {
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .row {
      margin-bottom: 18px;
    }

    .label {
      color: #777;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .chat-btn {
      background: #087f5b;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #333;
    }

    @media (max-width: 550px) {
      .container {
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">💬 SomChat</div>

  <a href="chat.html">
    Chat
  </a>
</header>

<div class="container">

  <div class="card">

    <div class="avatar" id="avatar">
      U
    </div>

    <h1 id="username">
      SomChat User
    </h1>

    <div class="status">
      ● Online
    </div>

    <div class="info">

      <div class="row">
        <div class="label">Username</div>
        <div class="value" id="usernameInfo">
          SomChat User
        </div>
      </div>

      <div class="row">
        <div class="label">Email</div>
        <div class="value" id="emailInfo">
          user@example.com
        </div>
      </div>

      <div class="row">
        <div class="label">Country</div>
        <div class="value">
          Somalia 🇸🇴
        </div>
      </div>

    </div>

    <div class="buttons">

      <a href="chat.html" class="btn chat-btn">
        💬 Open Chat
      </a>

      <button class="btn logout-btn" id="logout">
        Logout
      </button>

    </div>

  </div>

</div>

<script>
  document
    .getElementById("logout")
    .addEventListener("click", function() {

      alert("Logout will be connected to Supabase next.");

      window.location.href = "index.html";
    });
</script>

</body>
</html>
