<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SomChat - Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #075e54, #128c7e);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      color: #075e54;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #128c7e;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 22px;
      border-radius: 10px;
      background: #25d366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login a {
      color: #075e54;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="register-box">

  <div class="logo">💬</div>

  <h1>Create Account</h1>

  <p class="subtitle">
    Ku biir SomChat
  </p>

  <form id="registerForm">

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="Username"
      minlength="3"
      maxlength="30"
      required
    >

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email"
      required
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      minlength="6"
      required
    >

    <label>Country</label>
    <input
      id="country"
      type="text"
      placeholder="Somalia"
    >

    <button id="registerButton" type="submit">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://praguwyyshmhmmowofqv.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByYWd1d3l5c2htaG1tb3dvZnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzA3NjYsImV4cCI6MjEwMjE0Njc2Nn0.oJjsk_93uBMLeT-8ydDeecJBpcKI4IwTZaVmDU0t-fk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const form =
  document.getElementById("registerForm");

const button =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const username =
    document.getElementById("username")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const country =
    document.getElementById("country")
      .value.trim();


  if (username.length < 3) {

    message.innerHTML =
      "❌ Username waa inuu ugu yaraan 3 xaraf ahaadaa.";

    return;
  }


  button.disabled = true;
  button.textContent = "Creating account...";

  message.innerHTML = "";


  try {

    // Check username
    const { data: existingUser, error: checkError } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username", username)
        .maybeSingle();


    if (checkError) {
      throw checkError;
    }


    if (existingUser) {

      message.innerHTML =
        "❌ Username-kan hore ayaa loo isticmaalay.";

      button.disabled = false;
      button.textContent = "Create Account";

      return;
    }


    // Create Auth account
    const {
      data: authData,
      error: authError
    } = await supabaseClient.auth.signUp({

      email: email,

      password: password

    });


    if (authError) {
      throw authError;
    }


    const user = authData.user;


    if (!user) {

      throw new Error(
        "Account lama samayn. Fadlan mar kale isku day."
      );

    }


    // Create profile
    const {
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .insert({

        id: user.id,

        username: username,

        country: country,

        bio: "",

        avatar_url: "",

        online: false

      });


    if (profileError) {
      throw profileError;
    }


    message.innerHTML =
      "✅ Account waa la sameeyay!<br>" +
      "Waxaad hadda geli kartaa SomChat.";

    form.reset();

    button.disabled = false;
    button.textContent = "Create Account";


    setTimeout(() => {

      window.location.href =
        "login.html";

    }, 2000);


  } catch (error) {

    console.error(error);

    message.innerHTML =
      "❌ " + error.message;

    button.disabled = false;
    button.textContent =
      "Create Account";

  }

});

</script>

</body>
  </html>
