<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | SomChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #087f5b;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .bottom {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .bottom a {
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">💬 SomChat</div>

  <h2>Create Account</h2>

  <p class="subtitle">
    Join SomChat today
  </p>

  <form id="registerForm">

    <label for="username">Username</label>

    <input
      type="text"
      id="username"
      placeholder="Enter username"
      minlength="3"
      maxlength="30"
      required
    >

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Minimum 6 characters"
      minlength="6"
      required
    >

    <button id="registerButton" type="submit">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <div class="bottom">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>
  // ================================
  // SOMCHAT SUPABASE CONFIG
  // ================================

  const SUPABASE_URL =

  const SUPABASE_KEY =

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  // ================================
  // REGISTER
  // ================================

  const form =
    document.getElementById("registerForm");

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("registerButton");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
      document.getElementById("username")
        .value
        .trim();

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;

    message.textContent = "";
    message.style.color = "#555";

    if (username.length < 3) {
      message.textContent =
        "Username must be at least 3 characters.";
      return;
    }

    if (password.length < 6) {
      message.textContent =
        "Password must be at least 6 characters.";
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      // Create Supabase Auth account
      const {
        data,
        error
      } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        throw error;
      }

        throw new Error(
          "Account could not be created."

      }

      const {
