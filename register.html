<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SomChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f5f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      color: #087f5b;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .bottom {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #087f5b;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">💬 SomChat</div>

  <h2>Create Account</h2>

  <form id="registerForm">

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="Enter username"
      minlength="3"
      required
    >

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter email"
      required
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Minimum 6 characters"
      minlength="6"
      required
    >

    <button type="submit">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <div class="bottom">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>
  const SUPABASE_URL = "GELI_URL_KA_SOMCHAT";
  const SUPABASE_KEY = "GELI_PUBLISHABLE_KEY_KA_SOMCHAT";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("registerForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.style.color = "#555";
    message.textContent = "Creating account...";

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Account could not be created.");
      }

      const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
          id: data.user.id,
          username: username,
          email: email,
          country: "Somalia"
        });

      if (profileError) {
        throw profileError;
      }

      message.style.color = "#087f5b";
      message.textContent =
        "Account created successfully! You can now login.";

      form.reset();

    } catch (error) {

      message.style.color = "#d9534f";
      message.textContent = error.message;
    }
  });
</script>

</body>
</html>
