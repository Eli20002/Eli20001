<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SomChat - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#075e54,#128c7e);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  color:#075e54;
  margin:8px 0;
}

.sub{
  text-align:center;
  color:#777;
  margin-bottom:20px;
}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#25d366;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}

#result{
  margin-top:15px;
  text-align:center;
  line-height:1.5;
}

.login{
  text-align:center;
  margin-top:20px;
  color:#777;
}

.login a{
  color:#075e54;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">💬</div>

<h1>Create Account</h1>

<p class="sub">
Ku biir SomChat
</p>

<form id="form">

<label>Username</label>

<input
id="username"
type="text"
placeholder="Username"
minlength="3"
maxlength="30"
required
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email"
required
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
minlength="6"
required
>

<label>Country</label>

<input
id="country"
type="text"
placeholder="Somalia"
>

<button
id="button"
type="submit">
Create Account
</button>

</form>

<div id="result"></div>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

const SUPABASE_URL =
"https://praguwyyshmhmmowofqv.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicHJhZ3V3eXNobWhtbW93ZnF2Iiwicm9sIjoiYW5vbiIsImlhdCI6MTc4NjU3MDc2NiwiZXhwIjoyMTAyMTQ2NzY2fQ.oJjsk_93uBMLeT-8ydDeecJBpcKI4IwTZaVmDU0t-fk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


const form =
document.getElementById("form");

const button =
document.getElementById("button");

const result =
document.getElementById("result");


form.addEventListener(
"submit",
async function(e){

e.preventDefault();

const username =
document.getElementById("username")
.value.trim();

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

const country =
document.getElementById("country")
.value.trim();


if(username.length < 3){

result.innerHTML =
"❌ Username waa inuu ugu yaraan 3 xaraf ahaadaa.";

return;
}


button.disabled=true;

button.textContent=
"Creating...";

result.innerHTML="";


try{

/* Check username */

const {
data:existing,
error:checkError
} =
await supabaseClient
.from("profiles")
.select("id")
.eq("username",username)
.maybeSingle();


if(checkError)
throw checkError;


if(existing){

result.innerHTML=
"❌ Username-kan hore ayaa loo isticmaalay.";

button.disabled=false;

button.textContent=
"Create Account";

return;
}


/* CREATE AUTH ACCOUNT */

const {
data,
error
} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
username:username,
country:country
}
}

});


if(error)
throw error;


if(!data.user){

throw new Error(
"Account lama samayn."
);

}


/* SUCCESS */

result.innerHTML=
"✅ Account waa la sameeyay!<br><br>"+
"Waxaad hadda Login samayn kartaa.";


form.reset();

button.disabled=false;

button.textContent=
"Create Account";


setTimeout(
function(){

window.location.href=
"login.html";

},
2000
);


}catch(error){

console.error(error);

result.innerHTML=
"❌ "+error.message;

button.disabled=false;

button.textContent=
"Create Account";

}

});

</script>

</body>
</html>
