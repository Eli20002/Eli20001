<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SomChat - Users</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7f9;
}

header{
  background:#075e54;
  color:white;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  font-size:22px;
}

.logout{
  background:#d32f2f;
  border:0;
  color:white;
  padding:9px 14px;
  border-radius:8px;
}

.search{
  padding:12px;
  background:white;
}

#search{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

#users{
  padding:10px;
}

.user{
  background:white;
  margin-bottom:8px;
  padding:12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#128c7e;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:20px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
}

.name{
  font-weight:bold;
}

.country{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.chat{
  background:#128c7e;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header>

<h1>💬 SomChat</h1>

<button
class="logout"
id="logout">
Logout
</button>

</header>

<div class="search">

<input
id="search"
placeholder="🔎 Search username..."
>

</div>

<div id="users">

<div class="empty">
Loading users...
</div>

</div>

<script>

let currentUser=null;
let allUsers=[];

async function start(){

  const {
    data,
    error
  } =
  await supabaseClient.auth
  .getUser();

  if(error || !data.user){

    location.href="login.html";

    return;
  }

  currentUser=data.user;

  await loadUsers();

}

async function loadUsers(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,country,avatar_url,online"
  )
  .neq("id",currentUser.id)
  .order("username");

  if(error){

    console.error(error);

    document.getElementById("users")
    .innerHTML=
    `<div class="empty">
      ❌ ${error.message}
    </div>`;

    return;
  }

  allUsers=data || [];

  renderUsers(allUsers);

}

function renderUsers(users){

  const box=
    document.getElementById("users");

  box.innerHTML="";

  if(!users.length){

    box.innerHTML=
    `<div class="empty">
      No users found.
    </div>`;

    return;
  }

  users.forEach(user=>{

    const div=
      document.createElement("div");

    div.className="user";

    let avatar="👤";

    if(user.avatar_url){

      avatar=
      `<img src="${user.avatar_url}">`;

    }

    div.innerHTML=`

      <div class="avatar">
        ${avatar}
      </div>

      <div class="info">

        <div class="name">
          ${escapeHtml(user.username || "User")}
        </div>

        <div class="country">
          🌍 ${escapeHtml(user.country || "Unknown")}
        </div>

      </div>

      <button
        class="chat"
        onclick="openChat('${user.id}')">
        💬 Chat
      </button>

    `;

    box.appendChild(div);

  });

}

function openChat(id){

  location.href=
    "chat.html?user="+
    encodeURIComponent(id);

}

document
.getElementById("search")
.addEventListener(
"input",
function(){

  const q=
    this.value
    .trim()
    .toLowerCase();

  const filtered=
    allUsers.filter(user=>
      (user.username || "")
      .toLowerCase()
      .includes(q)
    );

  renderUsers(filtered);

});

document
.getElementById("logout")
.addEventListener(
"click",
async function(){

  await supabaseClient.auth.signOut();

  location.href="index.html";

});

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

start();

</script>

</body>
</html>
