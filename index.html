<html lang="en">

  <style>
    * {

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      display: flex;
      justify-content: center;

    .box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    h1 {
      color: #075e54;
      margin-bottom: 10px;
    }

    #status {
      padding: 15px;
      border-radius: 10px;
      background: #eee;
      margin-top: 20px;
    }

</head>

<body>

<script>

const SUPABASE_URL =

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByYWd1d3l5c2htaG1tb3dvZnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzA3NjYsImV4cCI6MjEwMjE0Njc2Nn0.oJjsk_93uBMLeT-8ydDeecJBpcKI4IwTZaVmDU0t-fk";

const supabaseClient =

      status.innerHTML =
        "❌ Connection Error<br><br>" +
        error.message;

    }

      "✅ Supabase Connected!<br><br>" +
      "SomChat diyaar ayuu yahay.";

    console.log("Supabase:", data);

  } catch (error) {

    status.innerHTML =
      "❌ Error<br><br>" +
      error.message;

  }
}

testSupabase();

</script>
