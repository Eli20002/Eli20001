<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SomChat | Somali Community</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      color: #17202a;
      min-height: 100vh;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav a,
    #logout {
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 550px;
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    p {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .register {
      background: #087f5b;
      color: white;
    }

    .login-btn {
      border: 2px solid #087f5b;
      color: #087f5b;
      background: white;
    }

    .chat-btn {
      background: #087f5b;
      color: white;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #777;
      font-size: 14px;
    }

    #loggedIn {
      display: none;
    }

    #loggedOut {
      display: block;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    💬 SomChat
  </div>

  <div class="nav">

    <div id="loggedOut">
      <a href="login.html">Login</a>
    </div>

    <div id="loggedIn">
      <a href="chat.html">Chat</a>
    </div>

  </div>

</header>


<main>

  <div class="box">

    <div class="icon">
      💬
    </div>

    <h1>
      Welcome to SomChat
    </h1>

    <p>
      Connect with friends, meet new people,
      and chat with the Somali community.
    </p>


    <!-- LOGGED OUT -->

    <div
      id="loggedOutButtons"
      class="buttons"
    >

      <a
        class="btn register"
        href="register.html"
      >
        Create Account
      </a>

      <a
        class="btn login-btn"
        href="login.html"
      >
        Login
      </a>

    </div>


    <!-- LOGGED IN -->

    <div
      id="loggedInButtons"
      class="buttons"
      style="display:none;"
    >

      <a
        class="btn chat-btn"
        href="chat.html"
      >
        💬 Open SomChat
      </a>

      <a
        class="btn login-btn"
        href="profile.html"
      >
        👤 My Profile
      </a>

    </div>

  </div>

</main>


<footer>
  © 2026 SomChat. All rights reserved.
</footer>


<script>

const SUPABASE_URL =
  "https://praguwyyshmhmmowofqv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JPzVvllEgAUcBD_ahGZR6g_Z2rrzRDW";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==================================
// CHECK LOGIN
// ==================================

async function checkLogin() {

  const {
    data
  } = await supabaseClient.auth.getUser();

  const loggedIn =
    !!data.user;


  if (loggedIn) {

    document.getElementById(
      "loggedOut"
    ).style.display = "none";

    document.getElementById(
      "loggedIn"
    ).style.display = "block";

    document.getElementById(
      "loggedOutButtons"
    ).style.display = "none";

    document.getElementById(
      "loggedInButtons"
    ).style.display = "flex";

  } else {

    document.getElementById(
      "loggedOut"
    ).style.display = "block";

    document.getElementById(
      "loggedIn"
    ).style.display = "none";

  }

}

checkLogin();

</script>

</body>
</html>
