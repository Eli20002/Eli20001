<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SomChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f8;
      color: #17202a;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .login {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    p {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .register {
      background: #087f5b;
      color: white;
    }

    .login-btn {
      border: 2px solid #087f5b;
      color: #087f5b;
      background: white;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">💬 SomChat</div>
    <a class="login" href="login.html">Login</a>
  </header>

  <main>
    <div class="box">

      <div class="icon">💬</div>

      <h1>Welcome to SomChat</h1>

      <p>
        Connect with friends, meet new people,
        and chat with the Somali community.
      </p>

      <div class="buttons">
        <a class="btn register" href="register.html">
          Create Account
        </a>

        <a class="btn login-btn" href="login.html">
          Login
        </a>
      </div>

    </div>
  </main>

  <footer>
    © 2026 SomChat. All rights reserved.
  </footer>

</body>
</html>
