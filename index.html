<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SomChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#075e54,#128c7e);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  padding:35px 25px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.logo{
  font-size:55px;
}

h1{
  color:#075e54;
  margin:10px 0;
}

p{
  color:#777;
  margin-bottom:25px;
}

.btn{
  display:block;
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
}

.register{
  background:#25d366;
  color:white;
}

.login{
  background:#075e54;
  color:white;
}

.status{
  margin-top:20px;
  padding:12px;
  border-radius:10px;
  background:#f1f5f9;
  color:#475569;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">💬</div>

<h1>SomChat</h1>

<p>
Chat with friends and connect with people.
</p>

<a class="btn register" href="register.html">
📝 Create Account
</a>

<a class="btn login" href="login.html">
🔐 Login
</a>

<div id="status" class="status">
Checking connection...
</div>

</div>

<script>

async function test(){

  const status =
    document.getElementById("status");

  const { error } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .limit(1);

  if(error){

    status.textContent =
      "❌ Supabase Error";

    console.error(error);

    return;
  }

  status.textContent =
    "✅ Supabase Connected!";

}

test();

</script>

</body>
</html>
